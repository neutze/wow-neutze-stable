<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#6b3a1c"/>
      <stop offset="0.55" stop-color="#3a1e0e"/>
      <stop offset="1" stop-color="#140904"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.3" stop-color="#d9a73a"/>
      <stop offset="0.6" stop-color="#8a5a14"/>
      <stop offset="0.85" stop-color="#e8c060"/>
      <stop offset="1" stop-color="#5a3608"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5a2b"/>
      <stop offset="1" stop-color="#4a2a12"/>
    </linearGradient>
    <radialGradient id="crust" cx="45%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffd58a"/>
      <stop offset="0.45" stop-color="#d8882f"/>
      <stop offset="1" stop-color="#6e3510"/>
    </radialGradient>
    <radialGradient id="potion" cx="40%" cy="40%" r="65%">
      <stop offset="0" stop-color="#ff9a9a"/>
      <stop offset="0.35" stop-color="#e0202a"/>
      <stop offset="1" stop-color="#4a0408"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="inner"><rect x="34" y="34" width="444" height="444" rx="10"/></clipPath>
  </defs>

  <!-- gold bevelled frame -->
  <rect x="0" y="0" width="512" height="512" rx="22" fill="#1a0e04"/>
  <rect x="8" y="8" width="496" height="496" rx="18" fill="url(#gold)"/>
  <rect x="26" y="26" width="460" height="460" rx="12" fill="#2a1606"/>

  <g clip-path="url(#inner)">
    <rect x="34" y="34" width="444" height="444" fill="url(#bg)"/>
    <!-- shelf planks -->
    <rect x="34" y="372" width="444" height="106" fill="url(#wood)"/>
    <rect x="34" y="368" width="444" height="10" fill="#b07a40"/>
    <path d="M34 410 H478 M34 446 H478" stroke="#2e1708" stroke-width="3" opacity="0.6"/>
    <circle cx="256" cy="250" r="190" fill="url(#glow)"/>

        <!-- horseshoe -->
    <ellipse cx="256" cy="372" rx="130" ry="16" fill="#000" opacity="0.45" filter="url(#soft)"/>
    <path d="M146 350 L146 230 A110 110 0 0 1 366 230 L366 350 L310 350 L310 232 A54 54 0 0 0 202 232 L202 350 Z" fill="url(#gold)" stroke="#2a1606" stroke-width="7" stroke-linejoin="round"/>
    <g fill="#3a1e0e">
      <circle cx="174" cy="300" r="8"/><circle cx="174" cy="250" r="8"/><circle cx="196" cy="186" r="8"/>
      <circle cx="338" cy="300" r="8"/><circle cx="338" cy="250" r="8"/><circle cx="316" cy="186" r="8"/>
    </g>
    <path d="M170 220 A90 90 0 0 1 240 140" stroke="#fff6c8" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- sparkle -->
    <path d="M150 140 l8 -26 l8 26 l26 8 l-26 8 l-8 26 l-8 -26 l-26 -8 z" fill="#fff3c0" opacity="0.9"/>
    <rect x="34" y="34" width="444" height="444" fill="url(#vignette)"/>
  </g>
  <!-- inner rim highlight -->
  <rect x="30" y="30" width="452" height="452" rx="12" fill="none" stroke="#000" stroke-width="6" opacity="0.7"/>
  <rect x="12" y="12" width="488" height="488" rx="16" fill="none" stroke="#fff6c8" stroke-width="3" opacity="0.6"/>
</svg>
